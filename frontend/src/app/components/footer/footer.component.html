<footer class="gf-footer">
  <div class="gf-footer__inner">
    <div class="gf-footer__brand">
      <img src="assets/logo.png" alt="Global Frío" width="40" height="40">
      <span class="gf-footer__lines">
        <span class="gf-footer__name">
          {{ configService.empresa.nombre }} — {{ configService.empresa.lema }}
        </span>
        <a
          class="gf-footer__dir"
          [href]="configService.enlaces.mapa"
          target="_blank"
          rel="noopener noreferrer">
          <span>{{ configService.ubicacion.direccion }}</span>
        </a>
      </span>
    </div>

    <nav class="gf-redes" aria-label="Redes sociales">
      <a
        *ngFor="let red of configService.redes"
        [href]="red.url"
        target="_blank"
        rel="noopener noreferrer">
        {{ red.nombre }}
      </a>
      <a
        [href]="configService.enlaces.whatsapp"
        target="_blank"
        rel="noopener noreferrer">
        WhatsApp
      </a>
    </nav>

    <p class="gf-copy">© 2026 Global Frío. Servicio a todo el Perú.</p>
  </div>
</footer>

<!-- Botón flotante de WhatsApp, visible en toda la página -->
<a
  class="gf-fab"
  [href]="configService.enlaces.whatsapp"
  target="_blank"
  rel="noopener noreferrer"
  aria-label="Escríbenos por WhatsApp">
  <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
    <path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/>
  </svg>
  <span class="gf-fab__texto">¿Hablamos?</span>
</a>
